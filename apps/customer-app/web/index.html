<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="customer_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>customer_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    google_maps_flutter_web محتاج مكتبة Google Maps JavaScript API محمّلة في الصفحة نفسها قبل
    أي محاولة لعرض GoogleMap widget — بعكس Android/iOS، مفيش حقن تلقائي من Flutter، لازم <script>
    يدوي هنا (كانت فجوة حقيقية: كان الملف ده افتراضي 100% بلا أي وسم Maps خالص، فـ`google.maps`
    تفضل undefined على الويب مهما كان المفتاح صح، والسبب مالوش أي علاقة بالبلد/الموقع الجغرافي).
    مفتاح مخصّص لـMaps JavaScript API (الويب) — مختلف عن مفتاح Android/iOS في
    AndroidManifest.xml/AppDelegate.swift عمدًا (المالك جهّزه بعد التوضيح: قيود المفتاحين مختلفة
    بطبيعتها — Android/iOS بيتقيّدوا بـpackage name/bundle id، الويب بيتقيّد بـHTTP referrer).
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmfNLFMj3OJoLqEosSEo1ugP1Ccqi4Y6k"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
