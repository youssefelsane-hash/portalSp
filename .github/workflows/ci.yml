name: CI

# كانت فجوة موثّقة صراحة (مراجعة تقنية 2026-08-13): مفيش أي CI في المشروع رغم حجمه — كل PR
# جديد ممكن يرجّع بَقّة قديمة اتصلحت من زمان من غير ما حد يلاحظ. الـworkflow ده بيغطي نفس
# الأربع فحوصات اللي CLAUDE.md بيطلب تشغيلها يدوي قبل أي commit في apps/api، زائد بناء الأدمن
# وflutter analyze للتطبيقين — نفس الأوامر بالحرف اللي بتتشغل يدوي حاليًا، هنا بس أوتوماتيك.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck + build + test
    runs-on: ubuntu-latest
    # شبكة أمان (2026-08-22) — لو --forceExit فوق ماحلّش handle-leak جديد لسه ماتلقطش، الـjob
    # يفشل بوضوح بعد 15 دقيقة بدل ما يفضل عالق للأبد (default runner timeout ساعات، مش دقايق).
    timeout-minutes: 15
    services:
      postgres:
        # نفس صورة infra/docker/docker-compose.yml بالحرف — الـmigrations محتاجة PostGIS فعلي.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: baytak
          POSTGRES_PASSWORD: baytak
          POSTGRES_DB: baytak
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U baytak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install (كل الـworkspaces)
        run: npm install

      - name: تجهيز .env
        run: |
          cp apps/api/.env.example apps/api/.env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgres://baytak:baytak@localhost:5432/baytak#' apps/api/.env
          sed -i 's#^REDIS_URL=.*#REDIS_URL=redis://localhost:6379#' apps/api/.env

      # فحص ترقيم الـmigrations **قبل** تطبيقها: رقمين متكررين معناهم ترتيب تطبيق غير محدد
      # على أي نشر نضيف. حصلت فعلاً لما سيشنين متوازيين خدوا `0257` (docs/08 §132).
      - name: فحص ترقيم الـmigrations
        run: node scripts/check-migrations.js

      - name: تطبيق الـmigrations
        run: node infra/migrations/migrate.js
        env:
          DATABASE_URL: postgres://baytak:baytak@localhost:5432/baytak

      # نظافة مخطّط القاعدة **بعد** تطبيق الـmigrations (لازم القاعدة تكون في حالتها النهائية).
      # بيمنع رجوع تلات فئات اتلقطوا في التدقيق الشامل ومحدش كان شايفهم: مفتاح أجنبي بلا فهرس
      # (DELETE على الأب = seq scan على الابن كله)، فهرس مكرّر، ونوع enum يتيم. الفئات دي
      # اتراكمت بصمت لأن مفيش اختبار ولا لينت بيشوف المخطّط أصلاً.
      - name: فحص نظافة مخطّط قاعدة البيانات
        run: node scripts/check-db-hygiene.js
        env:
          DATABASE_URL: postgres://baytak:baytak@localhost:5432/baytak

      - name: TypeScript typecheck
        working-directory: apps/api
        run: npx tsc --noEmit

      # لينت الباك-إند (docs/08 §132) — الموديول ده كان بلا أي lint خالص، فـ`tsc` كان بيمسك
      # أخطاء الأنواع بس. القواعد المفعّلة بتمسك الفئة اللي فعلاً وجعت المشروع: Promise
      # مهملة (`queue.add()` بلا await علّقت طلب حقيقي وقت انقطاع Redis).
      - name: ESLint
        working-directory: apps/api
        run: npx eslint src --max-warnings 0

      - name: npx nest build
        working-directory: apps/api
        run: npm run build

      - name: npx jest
        working-directory: apps/api
        # --runInBand إجباري هنا: عشرات الـspecs بتشارك حالة حقيقية على نفس قاعدة بيانات CI
        # الواحدة (محفظة المنصة النظامية، صفوف seed ثابتة) بافتراض تنفيذ متسلسل — بالظبط زي
        # القاعدة المتّبعة يدويًا قبل كل commit (راجع CLAUDE.md). تشغيل jest الافتراضي (عمّال
        # متوازيين) كان بيسبب سباقات حقيقية (deadlock على orders، duplicate key على
        # payments/idempotency، انحراف رصيد محفظة المنصة بين specs متزامنة) — مش بَقّة في كود
        # الميزة، فجوة في CI نفسه اتلقطت وهي بتكسر main بالفعل (run #207/#209).
        #
        # --forceExit مضافة (2026-08-22) — بَقّة موثّقة سابقًا في docs/08 (§36.9 ملحوظة تشغيلية):
        # jest بلا --forceExit بيعلّق لأكتر من 15 دقيقة بعد ما كل الاختبارات تخلص فعليًا فعلاً
        # (handle مسرّب من BullMQ/Redis في سبيك ما، مش السبب الجذري لسه اتحقق فيه) — بيمنع Node
        # process من الخروج طبيعيًا. كانت موثّقة كـ"لسه محتاجة تحقيق منفصل" بس CI ماكانش
        # مستخدمها فعليًا، فكل push كان بيقعد يعلّق للأبد بدل ما يفشل بوضوح أو يعدّي.
        run: npx jest --runInBand --forceExit
        env:
          DATABASE_URL: postgres://baytak:baytak@localhost:5432/baytak
          REDIS_URL: redis://localhost:6379

  admin:
    name: Admin — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install (كل الـworkspaces)
        run: npm install

      - name: بناء packages/shared-types
        run: npm run build --workspace=@baytak/shared-types

      # Next.js 15+ بيولّد أنواع ambient زي LayoutProps/PageProps في .next/types/ تلقائيًا وقت
      # build/dev — على checkout طازج مفيش .next خالص، فـtsc --noEmit لوحده بيفشل بـ"Cannot find
      # name 'LayoutProps'" رغم إن الكود صحيح 100%. `next typegen` بيولّد نفس الأنواع من غير build
      # كامل — بَقّة CI حقيقية اتلقطت واتصلحت (main كانت CI فيه فاشلة من يومين لنفس السبب).
      - name: next typegen (توليد LayoutProps/PageProps قبل typecheck)
        working-directory: apps/admin
        run: npx next typegen

      - name: TypeScript typecheck
        working-directory: apps/admin
        run: npx tsc --noEmit

      - name: next build
        working-directory: apps/admin
        run: npm run build

  flutter:
    # كانت فجوة موثّقة صراحة (docs/08 §19 بند 18): flutter analyze بس مش بيثبت إن الكود شغال
    # فعليًا (static analysis يعدّي حتى لو منطق الاختبار غلط) ولا إنه بيتبني فعلاً للمنصة
    # الحقيقية (يتلقط أخطاء Kotlin/native plugin registration/AndroidManifest مش ظاهرة لـanalyze).
    # test/ (وحدة/widget بلا باك-إند حي — test_live/ منفصل عمدًا، محتاج سيرفر API حقيقي شغال زي
    # ما موضّح في README كل تطبيق، خارج نطاق CI الحالي) وbuild apk --debug (بيستخدم توقيع debug
    # تلقائيًا من غير key.properties — نفس سلوك `flutter run --release` المحلي، مش فحص توقيع
    # الإصدار الحقيقي) اتضافوا هنا.
    name: "flutter analyze + test + build — ${{ matrix.app }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-app, technician-app]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: flutter pub get
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      # بَقّة CI حقيقية اتلقطت واتصلحت (main كانت CI فيه فاشلة من يومين): `flutter analyze` من غير
      # فلاج بيرجّع exit code 1 لأي issue حتى لو severity=info (زي use_null_aware_elements/
      # deprecated_member_use بعد ترقية Flutter SDK) — مفيش warning ولا error حقيقي هنا، الكود
      # شغال صح. `--no-fatal-infos` بيخلّي الـCI يفشل على warning/error فعليين بس (زي ما Dart نفسه
      # بيصنّف الخطورة)، مع إن كل الـinfo لسه بتتطبع في اللوج لأي حد يحب يصلحها لاحقًا (مش مخفية).
      - name: flutter analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos

      - name: flutter test (وحدة/widget بلا باك-إند حي)
        working-directory: apps/${{ matrix.app }}
        run: flutter test

      - name: flutter build apk --debug (فحص تصدير حقيقي، مش static analysis بس)
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --debug
